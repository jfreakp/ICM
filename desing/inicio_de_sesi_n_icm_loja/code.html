<!-- Header / Logo Area -->
<div class="flex flex-col items-center text-center gap-sm">
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center overflow-hidden border border-outline-variant">
<img alt="ICM Logo" class="w-full h-full object-cover" data-alt="A clean, minimalist logo for a government or institutional entity. The logo features a stylized shield or building column icon in deep navy blue (#002045) on a pure white background. The design is official, authoritative, and strictly geometric, suited for a corporate light-mode application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBDgQ8qCxZ_ydOvxjsYHqoAGHEGpgBG1fByWBXBNAK7RATMPJmy8_rNe5Ah3G7InHiqHfErxrCefTI4kNprSY6695wVrOTq4uGj3Vgd5XEHGTiXTYqSt8gVcmYSpDOj8fNsCYpJ5b0O9ATeWUjkkRJj1cuQq1E6ixtWhQeJlEW7S16tqKOHvuWLZBQFuuZvTnKjBgX9IADzLdwiObXJaejcA7Qf_PpuCvvdRzrH9IKf5KtwX6uhu0Qy0A"/>
</div>
<div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">ICM Loja</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-base">Sistema de Multas</p>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase bg-surface-container-lowest px-1 w-fit" for="email">Correo Electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full h-12 pl-10 pr-4 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors duration-200" id="email" name="email" placeholder="usuario@icm.gob.ec" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase bg-surface-container-lowest px-1 w-fit" for="password">Contraseña</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container hover:underline transition-colors" href="#">¿Olvidó su contraseña?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full h-12 pl-10 pr-10 rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<button class="mt-sm h-12 w-full bg-primary text-on-primary rounded-md font-headline-md text-headline-md hover:bg-primary-container active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 shadow-sm" type="submit">
                Iniciar Sesión
                <span class="material-symbols-outlined text-[20px]">login</span>
</button>
<div class="mt-xs text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-primary">verified_user</span>
                    Acceso seguro y autorizado
                 </p>
</div>
</form>
